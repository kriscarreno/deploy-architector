<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="256" cy="256" r="256" fill="url(#bg)"/>

  <!-- Outer ring -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="url(#accent)" stroke-width="6" opacity="0.4"/>

  <!-- Inner ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#accent)" stroke-width="2" opacity="0.2"/>

  <!-- Orbit dots (nodes representing servers/deployments) -->
  <circle cx="256" cy="36"  r="12" fill="#38bdf8" opacity="0.9"/>
  <circle cx="456" cy="176" r="10" fill="#6366f1" opacity="0.8"/>
  <circle cx="456" cy="336" r="10" fill="#6366f1" opacity="0.8"/>
  <circle cx="256" cy="476" r="12" fill="#38bdf8" opacity="0.9"/>
  <circle cx="56"  cy="336" r="10" fill="#6366f1" opacity="0.8"/>
  <circle cx="56"  cy="176" r="10" fill="#6366f1" opacity="0.8"/>

  <!-- Connecting lines from center to dots -->
  <line x1="256" y1="256" x2="256" y2="48"  stroke="url(#accent)" stroke-width="2" opacity="0.3"/>
  <line x1="256" y1="256" x2="444" y2="183" stroke="url(#accent)" stroke-width="2" opacity="0.3"/>
  <line x1="256" y1="256" x2="444" y2="329" stroke="url(#accent)" stroke-width="2" opacity="0.3"/>
  <line x1="256" y1="256" x2="256" y2="464" stroke="url(#accent)" stroke-width="2" opacity="0.3"/>
  <line x1="256" y1="256" x2="68"  cy="329"  stroke="url(#accent)" stroke-width="2" opacity="0.3"/>
  <line x1="256" y1="256" x2="68"  y2="183"  stroke="url(#accent)" stroke-width="2" opacity="0.3"/>

  <!-- Center glow -->
  <circle cx="256" cy="256" r="100" fill="#0f172a"/>
  <circle cx="256" cy="256" r="98"  fill="none" stroke="url(#accent)" stroke-width="3" opacity="0.6"/>

  <!-- Lightning bolt (deploy symbol) centered -->
  <path d="M276 148 L224 268 L258 268 L236 364 L302 228 L264 228 Z"
        fill="url(#bolt)"
        stroke="#38bdf8"
        stroke-width="3"
        stroke-linejoin="round"/>
</svg>
