version: "3.9"

services:
  # ── Redis ──────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: deploy_orchestrator_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
  # ── API server (optional — remove if running locally with `npm start`) ──
  # api:
  #   build: .
  #   container_name: deploy_orchestrator_api
  #   restart: unless-stopped
