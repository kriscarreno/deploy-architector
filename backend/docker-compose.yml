  #     redis:
  #       condition: service_healthy
  #   ports:
  #     - "3000:3000"
  #   env_file:
  #     - .env
  #   volumes:
  #     # Persist SQLite DB and cloned repos outside the container
  #     - ./data:/app/data
  #   command: node src/server.js

  # ── Worker (optional) ───────────────────────────────────────────────────
  # worker:
  #   build: .
  #   container_name: deploy_orchestrator_worker
  #   restart: unless-stopped
  #   depends_on:
  #     redis:
  #       condition: service_healthy
  #   env_file:
  #     - .env
  #   volumes:
  #     - ./data:/app/data
  #   command: node src/workers/deployWorker.js

volumes:
  redis_data:
